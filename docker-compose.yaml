services:
  messanger:
    container_name: messanger_cont
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=${POSTGRES_DB_HOST}
      - PGPORT=${POSTGRES_DB_PORT}
      - PGUSER=${POSTGRES_DB_USER}
      - PGPASSWORD=${POSTGRES_DB_PASSWORD}
      - PGDATABASENAME=${POSTGRES_DB_NAME}
      - PGSSLMODE=${PGSSLMODE_STATUS}      
    volumes:
      - ./app:/messanger_src/messanger
    ports:
      - "${APP_HOST_PORT}:8080"
    restart: always
    env_file:
    # для безопасности данные среды хранятся в env 
    # (обычо не заливается в репу)
      - .env
    networks:
      - messanger-network

  postgres:
    container_name: postgres_cont
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
    ports:
      - "${POSTGRES_DB_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "${HEALTHCHECK_CMD}"]
      interval: ${HEALTHCHECK_INTERVAL} 
      timeout:  ${HEALTHCHECK_TIMEOUT}
      retries:  ${HEALTHCHECK_RETRIES}
    volumes:
      # данные, которые появляются\меняются в постгре переходят на пк
      - .postgres:/var/lib/postgres/data
    restart: always
    networks:
      - messanger-network

networks:
  messanger-network:
    driver: bridge
    name: messanger-network

